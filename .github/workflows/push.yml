name: Build latest SteamOS Charcoal kernel

on:
  push:
    branches:
      - master
      - 'validation/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the compiled packages as the latest stable GitHub release (master only)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

# Each execution gets its own group. Stale runs cannot block newer builds,
# and GitHub does not need to cancel a previous run before scheduling the next.
concurrency:
  group: charcoal-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Configure zswap
        run: |
          echo zstd | sudo tee /sys/module/zswap/parameters/compressor
          echo 90 | sudo tee /sys/module/zswap/parameters/max_pool_percent
          echo 1 | sudo tee /sys/module/zswap/parameters/shrinker_enabled
          echo 1 | sudo tee /sys/module/zswap/parameters/enabled

      - name: Free runner space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Configure 16 GiB swap
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ZIP packaging tool
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: Test release installer
        run: |
          set -Eeuo pipefail
          bash -n install-charcoal.sh
          bash tests/test-install-charcoal.sh
      - name: Validate runtime tuning payload
        run: |
          set -Eeuo pipefail
          bash tests/test-runtime-tuning.sh

      - name: Resolve latest controller drivers
        run: |
          set -Eeuo pipefail
          python3 tests/test-controller-driver-resolution.py -v
          python3 automation/resolve-controller-drivers.py --write | tee controller-driver-resolution.log
          mv controller-driver-resolution.log logs/controller-driver-resolution.log
          bash -n PKGBUILD

      - name: Resolve latest compatible SteamOS patches
        run: |
          set -Eeuo pipefail
          mkdir -p logs
          python3 -m py_compile automation/resolve-latest-patches.py automation/validate-patch-lock.py automation/audit-latest-patch-versions.py automation/apply-resolved-patch.py automation/finalize-pkgbuild-checksums.py automation/port-poc-selector.py automation/configure-zen-interactive.py tests/test_zen_interactive_profile.py tests/test_patch_cpu_optimizations_port.py tests/test_release_latest_verification.py automation/fix-gud-tv-mode-fortify.py tests/test_patch_gud_fortify.py automation/fix-lru-marie-whitespace.py tests/test_lru_marie_whitespace.py automation/fix-nap-compat.py tests/test_nap_compat.py
          python3 automation/resolve-latest-patches.py --write | tee logs/resolver.log
          python3 automation/validate-patch-lock.py | tee logs/patch-lock-validation.log
          python3 automation/audit-latest-patch-versions.py | tee logs/latest-patch-audit.log
          python3 automation/port-poc-selector.py --validate latest-poc-selector.patch | tee logs/poc-adapter-validation.log
          python3 tests/test-bore-overlay.py
          python3 tests/test_zen_interactive_profile.py
          python3 tests/test_patch_gud_fortify.py
          python3 tests/test_lru_marie_whitespace.py
          python3 tests/test_nap_compat.py
          python3 tests/test_patch_cpu_optimizations_port.py
          python3 tests/test_release_latest_verification.py
          bash -n PKGBUILD
          grep -Fq '"version": "6.18.' logs/patch-lock.json
          grep -Fq 'latest-adios.patch' PKGBUILD
          grep -Fq 'latest-lru_marie.patch' PKGBUILD
          grep -Fq 'latest-zram-ir.patch' PKGBUILD
          grep -Fq 'latest-amd-pstate-epp-boost-01-kernel-doc.patch' PKGBUILD
          grep -Fq 'latest-amd-pstate-epp-boost-02-cache-order.patch' PKGBUILD
          grep -Fq 'latest-amd-pstate-epp-boost-03-core.patch' PKGBUILD
          grep -Fq 'latest-amd-pstate-epp-boost-04-docs.patch' PKGBUILD
          grep -Fq 'latest-poc-selector.patch' PKGBUILD
          grep -Fq 'latest-nap.patch' PKGBUILD
          grep -Fq 'latest-bore.patch' PKGBUILD
          grep -Fq 'latest-bore-sched-ext-coexistence-fix.patch' PKGBUILD
          ! grep -Fqi 'infinity' PKGBUILD
          ! grep -Fq 'drm_sched_rr_default.patch' PKGBUILD
          python3 - <<'PY'
          import json
          import re

          with open("logs/patch-lock.json", encoding="utf-8") as handle:
              lock = json.load(handle)

          assert lock["kernel"]["version"].startswith("6.18.")

          expected_repositories = {
              "lru_marie": "firelzrd/lru_marie",
              "zram_ir": "firelzrd/zram-ir",
              "adios": "firelzrd/adios",
              "bore": "firelzrd/bore-scheduler",
              "bore_sched_ext_coexistence": "firelzrd/bore-scheduler",
              "poc_selector": "firelzrd/poc-selector",
              "nap": "firelzrd/nap",
          }

          assert set(lock["components"]) == set(expected_repositories)
          for name, item in lock["components"].items():
              assert re.fullmatch(r"[0-9a-f]{64}", item["sha256"])
              assert item["size"] > 0
              assert item["origin"] in {
                  "upstream-native", "upstream-kernel-agnostic",
                  "adaptive-port", "local-port"
              }
              assert item["selection"] in {
                  "latest-native-series", "latest-kernel-agnostic",
                  "latest-release-port", "latest-release-adaptive-port",
              }
              if item["origin"] in {"upstream-native", "upstream-kernel-agnostic"}:
                  assert item["repository"] == expected_repositories[name]
                  assert item["commit"] and item["commit"] != "repository-local"
                  assert item["path"] and item["url"]
              elif item["origin"] == "adaptive-port":
                  assert item["repository"] == expected_repositories[name]
                  assert item["adapter"] == {"poc_selector": "poc-selector-valve", "nap": "nap-direct-apply-6.18"}.get(name)
                  assert item["commit"] and item["commit"] != "repository-local"
                  assert item["path"] and item["url"]
              else:
                  upstream = item.get("upstream")
                  assert item["repository"] == "zarpon/linux-charcoal-vulcano"
                  assert upstream and upstream["repository"] == expected_repositories[name]
                  assert upstream["commit"] and upstream["commit"] != "repository-local"
                  assert upstream["path"] and upstream["url"]
                  assert re.fullmatch(r"[0-9a-f]{64}", upstream["sha256"])
                  assert upstream["size"] > 0

          for item in lock["components"].values():
              fallback = item.get("fallback")
              if not fallback:
                  continue
              assert fallback["kernel_version"] == lock["kernel"]["version"]
              assert fallback["kind"] in {"local-port", "adaptive-port"}

          lru = lock["components"]["lru_marie"]
          assert lru["origin"] in {"upstream-native", "local-port", "adaptive-port"}
          if lru["origin"] == "upstream-native":
              assert lru["selection"] == "latest-native-series"
              assert lru["kernel_version"].startswith("6.18.")
          else:
              assert lru["selection"] in {"latest-release-port", "latest-release-adaptive-port"}
              upstream = lru.get("upstream", lru)
              assert upstream["repository"] == "firelzrd/lru_marie"
              assert upstream["project_version"]

          poc = lock["components"]["poc_selector"]
          assert poc["origin"] in {"upstream-native", "adaptive-port"}
          if poc["origin"] == "adaptive-port":
              assert poc["adapter"] == "poc-selector-valve"
              assert poc["selection"] == "latest-release-adaptive-port"
          else:
              assert poc["selection"] == "latest-native-series"
          PY

      - name: Prepare compiler cache
        run: mkdir -p .cache/ccache

      - name: Compute compiler cache keys
        id: ccache-key
        env:
          CCACHE_INPUT_HASH: ${{ hashFiles('Dockerfile', 'docker/setup.sh', 'PKGBUILD', 'automation/patch-sources.json', 'automation/patch-source-overrides.json', 'automation/resolve-latest-patches.py', 'logs/patch-lock.json', '**/*.patch', 'config', 'config-neptune', 'config-charcoal') }}
        run: |
          set -Eeuo pipefail
          restore_prefix="ccache-${RUNNER_OS}-${RUNNER_ARCH}-llvm-${CCACHE_INPUT_HASH}"
          save_key="${restore_prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "restore_prefix=${restore_prefix}-" >> "$GITHUB_OUTPUT"
          echo "save_key=${save_key}" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ccache
          key: ${{ steps.ccache-key.outputs.save_key }}
          fail-on-cache-miss: false
          restore-keys: |
            ${{ steps.ccache-key.outputs.restore_prefix }}
            ccache-${{ runner.os }}-${{ runner.arch }}-llvm-

      - name: Report compiler cache lookup
        env:
          CACHE_MATCHED_KEY: ${{ steps.restore-ccache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$CACHE_MATCHED_KEY" ]]; then
            echo "Using previous compiler cache: $CACHE_MATCHED_KEY"
          else
            echo "No previous compiler cache matched; starting a cold cache safely"
          fi

      - name: Build Docker image
        run: docker build . -t charcoal 2>&1 | tee logs/docker-build.log

      - name: Validate sources and build packages
        run: |
          set -Eeuo pipefail
          restore_workspace_owner() {
            local owner="$(id -u):$(id -g)"
            # Only host-side control paths need to be writable after the
            # container exits. Avoid traversing the complete kernel tree.
            sudo chown "$owner" "$PWD" || true
            sudo chown -R "$owner" "$PWD/logs" "$PWD/.git" "$PWD/.cache" 2>/dev/null || true
          }
          trap restore_workspace_owner EXIT

          # makepkg must run as an unprivileged user and must be able to create
          # src/pkg below /project. Restore the complete workspace afterwards,
          # including .git, for host-side packaging and release operations.
          docker run --rm -v "$PWD:/project" charcoal chown -R nobody /project
          docker run --rm -v "$PWD:/project" charcoal sudo -u nobody bash -lc '
            set -Eeuo pipefail
            cd /project

            export CCACHE_DIR=/project/.cache/ccache
            export CCACHE_BASEDIR=/project
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=true
            export CCACHE_MAXSIZE=5G
            export CCACHE_COMPRESS=true
            ccache --show-config | tee logs/ccache-config.txt
            ccache --show-stats | tee logs/ccache-before.txt

            # Fetch sources once. The resolver lock records the SHA-256 of every
            # dynamically materialized patch. No patch is applied at this stage.
            makepkg --verifysource --skipchecksums 2>&1 | tee logs/verifysource-bootstrap.log

            # Generate checksums from the exact downloaded bytes and rewrite the
            # PKGBUILD. SKIP is permitted only for pinned VCS sources.
            makepkg -g > logs/generated-sha256sums.txt
            python3 automation/finalize-pkgbuild-checksums.py \
              --generated logs/generated-sha256sums.txt \
              --report logs/checksum-validation.txt
            bash -n PKGBUILD

            python3 - <<'PY'
          import importlib.util
          import re
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "checksum_validation", "automation/finalize-pkgbuild-checksums.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          sources = module.evaluated_array(Path("PKGBUILD"), "source")
          checksums = module.evaluated_array(Path("PKGBUILD"), "sha256sums")
          assert len(sources) == len(checksums), (len(sources), len(checksums))
          assert checksums and any(checksum != "SKIP" for checksum in checksums)
          vcs = {
              index
            for index, source in enumerate(sources)
              if "git+" in source or source.startswith(("git://", "svn+", "hg+", "bzr++"))
          }
          for index, checksum in enumerate(checksums):
            if checksum == "SKIP":
              assert index in vcs, sources[index]
            else:
              assert re.fullmatch(r"[0-9a-f]{64}", checksum), sources[index]
          skip = "SKIP"
          print(f"sources={len(sources)} sha256={len(checksums) - sum(item == skip for item in checksums)} vcs_skip={sum(item == skip for item in checksums)}")
          PY

            # Verify again, now against real SHA-256 values, before prepare/build.
            makepkg --verifysource 2>&1 | tee logs/verifysource.log
            # Keep the prepared tree until the mandatory post-build diff check.
            # makepkg -c removed src/ after a successful package build, making
            # the check fail deterministically even though compilation succeeded.
            makepkg -Cf --noconfirm 2>&1 | tee logs/makepkg.log
            git -C src/archlinux-linux-charcoal diff --check | tee logs/git-diff-check.txt
            ccache --show-stats | tee logs/ccache-after.txt
          '
          # The container created logs as nobody; host-side post-processing
          # must be able to create checksums, the ZIP and release notes.
          restore_workspace_owner
          trap - EXIT
          compgen -G 'linux-charcoal-*.pkg.tar.zst' >/dev/null
          sha256sum linux-charcoal-*.pkg.tar.zst | tee logs/SHA256SUMS
          PKGVER="$(bash -c 'source PKGBUILD; printf "%s" "$pkgver"')"
          KERNEL_TAG="$(bash -c 'source PKGBUILD; printf "%s" "$_tag"')"
          echo "PKGVER=$PKGVER" >> "$GITHUB_ENV"
          echo "KERNEL_TAG=$KERNEL_TAG" >> "$GITHUB_ENV"
          RELEASE_TAG="charcoal-${PKGVER}-r${GITHUB_RUN_NUMBER}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          RELEASE_ZIP="linux-charcoal-${PKGVER}-r${GITHUB_RUN_NUMBER}.zip"
          echo "RELEASE_ZIP=$RELEASE_ZIP" >> "$GITHUB_ENV"

      - name: Save compiler cache
        if: ${{ always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ccache-key.outputs.save_key != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/ccache
          key: ${{ steps.ccache-key.outputs.save_key }}

      - name: Generate release description
        run: |
          set -Eeuo pipefail
          previous=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            previous="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          fi
          {
            echo "# Charcoal SteamOS kernel ${PKGVER}"
            echo
            echo "Built from the latest SteamOS 6.18 tag: \`${KERNEL_TAG}\`."
            echo
            echo "## Updates"
            python3 - <<'PY'
          import json

          with open("logs/patch-lock.json", encoding="utf-8") as handle:
              lock = json.load(handle)

          for name, item in lock["components"].items():
              origin = item.get("origin", "unknown")
              path = item.get("path", "unknown")
              commit = item.get("commit", "unknown")
              if origin == "local-port":
                  detail = f"reviewed SteamOS 6.18 local port ({path})"
                  upstream = item.get("upstream")
                  if upstream:
                    detail += (
                        f" following {upstream.get('repository')}"
                        f"/{upstream.get('path')}@{upstream.get('commit')}"
                    )
              else:
                  detail = f"latest compatible upstream patch ({path})"
              print(f"- **{name}**: {detail}; source commit `{commit}`.")
          PY
            echo
            echo "## Artifacts"
            echo "- Kernel package ZIP: \`${RELEASE_ZIP}\`"
            echo "- Kernel source: \`${KERNEL_TAG}\`"
            echo
            echo "## Changes in the repository"
            if [[ -n "$previous" ]] && git rev-parse --verify --quiet "${previous}^{commit}" >/dev/null; then
              git log --pretty='- %s (%h)' "${previous}..HEAD"
            else
              if [[ -n "$previous" ]]; then
                echo "- Previous release ref \`${previous}\` is not present in this checkout; showing recent commits."
              fi
              git log -20 --pretty='- %s (%h)'
            fi
          } > logs/release-notes.md

      - name: Assemble kernel release ZIP
        run: |
          set -Eeuo pipefail
          # Recreate the staging directory so a retry can never carry a
          # previous release archive into the next archive.
          rm -rf -- release
          rm -f -- "${RELEASE_ZIP}"
          mkdir release
          shopt -s nullglob
          packages=(linux-charcoal-*.pkg.tar.zst)
          if ((${#packages[@]} == 0)); then
            echo "No kernel packages were produced" >&2
            exit 1
          fi
          cp -- "${packages[@]}" release/
          cp logs/patch-lock.json logs/checksum-validation.txt logs/SHA256SUMS logs/release-notes.md release/
          cat > release/README.md <<EOF
          # Charcoal SteamOS kernel ${KERNEL_TAG}

          This archive contains the compiled Charcoal kernel packages for SteamOS.

          Install on SteamOS with:

              sudo steamos-readonly disable
              sudo pacman -U linux-charcoal-*.pkg.tar.zst
              sudo steamos-readonly enable

          The archive also contains the exact patch lock, SHA-256 checksums and build
          description used for this release.
          EOF
          package_names=()
          for package in "${packages[@]}"; do
            package_names+=("${package##*/}")
          done
          (
            cd release
            zip -9 -q "../${RELEASE_ZIP}" \
              README.md \
              patch-lock.json \
              checksum-validation.txt \
              SHA256SUMS \
              release-notes.md \
              "${package_names[@]}"
          )
          python3 - "${RELEASE_ZIP}" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as handle:
              names = handle.namelist()
          nested = [name for name in names if name.lower().endswith(".zip")]
          if nested:
              raise SystemExit(f"release archive contains nested ZIP files: {nested}")
          if len(names) != len(set(names)):
              raise SystemExit("release archive contains duplicate entries")
          required = {
              "README.md",
              "SHA256SUMS",
              "checksum-validation.txt",
              "patch-lock.json",
              "release-notes.md",
          }
          missing = sorted(required - set(names))
          if missing:
              raise SystemExit(f"release archive is missing entries: {missing}")
          PY
          sha256sum "${RELEASE_ZIP}" | tee logs/RELEASE-ZIP-SHA256SUM

      - name: Upload test artifacts
        if: github.event_name == 'pull_request' || startsWith(github.ref_name, 'validation/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-charcoal-packages-${{ env.PKGVER }}
          path: |
            linux-charcoal-*.pkg.tar.zst
            logs/patch-lock.json
            logs/checksum-validation.txt
            logs/SHA256SUMS
            logs/RELEASE-ZIP-SHA256SUM
            logs/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: >-
          (github.event_name == 'push' && github.ref_name == 'master') ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref_name == 'master' &&
           inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          packages=(linux-charcoal-*.pkg.tar.zst)
          if ((${#packages[@]} == 0)); then
            echo "No kernel packages are available for the release" >&2
            exit 1
          fi
          assets=(
            "${RELEASE_ZIP}"
            logs/RELEASE-ZIP-SHA256SUM
            "${packages[@]}"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Release asset is missing: $asset" >&2
              exit 1
            fi
          done

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            existing_tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$existing_tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Remote tag ${RELEASE_TAG} points to ${existing_tag_commit}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "Reusing existing release tag ${RELEASE_TAG}"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --latest \
              --notes-file logs/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --latest \
              --notes-file logs/release-notes.md \
              --verify-tag
          fi

          release_is_stable="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '.isDraft == false and .isPrerelease == false')"
          latest_release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "$release_is_stable" != "true" || "$latest_release_tag" != "$RELEASE_TAG" ]]; then
            echo "Release ${RELEASE_TAG} is not a published stable GitHub latest release (latest tag: ${latest_release_tag})" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${assets[@]}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charcoal-validation-${{ github.run_number }}
          path: logs
          if-no-files-found: warn
          retention-days: 30

