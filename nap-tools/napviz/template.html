<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>napviz</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--sub:#5b6570;--line:#d9dee4;--acc:#2563eb;--acc2:#d97706;--good:#15803d;--bad:#b91c1c;--cell:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--panel:#1c2026;--ink:#e6e9ed;--sub:#97a1ad;--line:#2d343c;--acc:#6ea0ff;--acc2:#f0a23a;--good:#4ade80;--bad:#f87171;--cell:#262c34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans CJK JP",sans-serif}
header{padding:14px 16px 8px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
.models{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--sub)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--sub)}
.drop.over{border-color:var(--acc);color:var(--acc)}
nav{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--sub);cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
main{padding:14px 16px 40px;max-width:1280px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:14px}
.card p.note{margin:4px 0 8px;color:var(--sub);font-size:12.5px}
canvas{width:100%;display:block}
table{border-collapse:collapse;width:100%}th,td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--sub);font-weight:500;font-size:12.5px}td:first-child,th:first-child{text-align:left}
select,input[type=number],input[type=text]{font:inherit;background:var(--cell);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
input[type=number]{width:84px}
input[type=range]{width:100%}
.row{display:grid;grid-template-columns:minmax(150px,230px) 1fr 110px;gap:8px;align-items:center;padding:1px 0}
.row label{color:var(--sub);font-size:12.5px}.row output{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--cell);margin:0 4px 4px 0;cursor:pointer;border:1px solid var(--line)}
.pill:hover{border-color:var(--acc)}
.warn{color:var(--bad)}.ok{color:var(--good)}
.legend span{display:inline-flex;align-items:center;margin-right:12px;font-size:12.5px;color:var(--sub)}
.legend i{width:12px;height:12px;border-radius:3px;margin-right:5px;display:inline-block}
.best{font-weight:650;color:var(--acc)}
.bar{height:8px;border-radius:4px;background:var(--acc);opacity:.75}
</style>
</head>
<body>
<header>
  <h1>napviz <span style="font-weight:400;color:var(--sub)">— look into nap's weights and decisions</span></h1>
  <div class="models">
    <span>A: <b id="nameA">built-in default model</b></span>
    <label class="drop" id="drop">B: drop a weight dump here / <u>choose</u><input id="file" type="file" hidden></label>
    <span id="nameB" style="color:var(--sub)">not loaded</span>
    <label id="cpuWrap" hidden>CPU <select id="cpuSel"></select></label>
    <label>analyse <select id="active"><option value="A">A</option></select></label>
  </div>
</header>
<nav id="nav"></nav>
<main>
<section class="tab" id="tab-overview"></section>
<section class="tab" id="tab-embed"></section>
<section class="tab" id="tab-predict"></section>
<section class="tab" id="tab-decide"></section>
<section class="tab" id="tab-compare"></section>
</main>
<script>
/*DATA*/
/*CORE*/
/*UI*/
</script>
</body>
</html>
